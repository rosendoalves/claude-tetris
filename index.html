<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo). Dark por defecto.
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro"></button>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div id="freeze" class="freeze hidden" aria-live="polite"></div>
        <div id="ability-menu" class="ability-menu hidden">
          <p class="ability-title">HABILIDADES</p>
          <div id="ability-list" class="ability-list"></div>
          <p class="ability-hint"><kbd>1</kbd>-<kbd>5</kbd> elegir · <kbd>Esc</kbd> cerrar</p>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div id="energy-section" class="panel-section">
          <span class="label">ENERGY</span>
          <div id="energy" class="energy" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="energy-fill" class="energy-fill"></div>
          </div>
          <span id="effects" class="effects"></span>
        </div>
      </aside>

      <aside class="panel panel-side">
        <div id="challenge-hud" class="panel-section hidden">
          <span class="label">CHALLENGE</span>
          <span id="challenge-name" class="challenge-name"></span>
          <span id="objective" class="objective"></span>
          <span id="progress" class="progress"></span>
        </div>

        <div id="vision-panel" class="panel-section inactive">
          <span class="label">VISION</span>
          <canvas id="vision-canvas" width="64" height="320"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>E</kbd> habilidades</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="menu-btn" class="secondary-btn">Menú</button>
      </div>
    </div>

    <div id="start-menu" class="overlay start-menu">
      <div class="overlay-box">
        <p class="menu-title">TETRIS</p>
        <div id="menu-modes" class="menu-group">
          <button id="mode-normal" class="menu-btn">Normal</button>
          <button id="mode-challenge" class="menu-btn">Desafío</button>
        </div>
        <div id="menu-levels" class="menu-group hidden">
          <p class="menu-subtitle">Elige un desafío</p>
          <div id="level-list" class="level-list"></div>
          <button id="levels-back" class="secondary-btn">Atrás</button>
        </div>
      </div>
    </div>
  </div>

  <script src="scoring.js"></script>
  <script src="pieces.js"></script>
  <script src="powerups.js"></script>
  <script src="abilities.js"></script>
  <script src="levels.js"></script>
  <script src="challenge.js"></script>
  <script src="hold.js"></script>
  <script src="game.js"></script>
</body>
</html>
